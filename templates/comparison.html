<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轴承对比分析 - 铁路轴承健康分析系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-train-front"></i>
            <span class="brand-text">铁路列车轴承剩余寿命预测系统</span>
        </div>
        <nav class="sidebar-nav">
            <a href="/dashboard" class="nav-item">
                <i class="bi bi-speedometer2"></i>
                <span>系统仪表盘</span>
            </a>
            <a href="/comparison" class="nav-item active">
                <i class="bi bi-bar-chart-steps"></i>
                <span>对比分析</span>
            </a>
            <a href="/rul" class="nav-item">
                <i class="bi bi-hourglass-split"></i>
                <span>剩余寿命预测</span>
            </a>
            <div class="nav-divider"></div>
            <a href="/dashboard" class="nav-item">
                <i class="bi bi-arrow-left"></i>
                <span>返回仪表盘</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <i class="bi bi-person-circle"></i>
                <span>{{ user.name if user else '用户' }}</span>
            </div>
            <button onclick="handleLogout()" class="btn-logout">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <button class="toggle-sidebar" onclick="toggleSidebar()">
                <i class="bi bi-list"></i>
            </button>
            <div class="topbar-title">轴承对比分析</div>
            <div class="topbar-right">
                <span class="topbar-time" id="topbarTime"></span>
            </div>
        </header>

        <div class="content-area">
            <!-- Bearing selection -->
            <div class="control-panel">
                <div class="panel-title">
                    <i class="bi bi-check2-square"></i> 选择对比轴承（最多4个）
                </div>
                <div class="control-row">
                    <div class="control-item" style="flex: 2;">
                        <label>轴承选择</label>
                        <div class="bearing-multi-select" id="bearingMultiSelect">
                            <div class="text-center py-2 text-muted small">加载中...</div>
                        </div>
                    </div>
                    <div class="control-item">
                        <label>数据集筛选</label>
                        <select id="datasetFilter" onchange="loadBearingCheckboxes()">
                            <option value="all">全部</option>
                            <option value="xjtu" selected>XJTU-SY</option>
                            <option value="test">测试样本</option>
                            <option value="gearbox">Gearbox</option>
                        </select>
                    </div>
                    <div class="control-item">
                        <label>对比维度</label>
                        <select id="compareMetric">
                            <option value="rms">RMS 趋势</option>
                            <option value="peak">峰值趋势</option>
                            <option value="peak_to_peak">峰峰值趋势</option>
                            <option value="crest_factor">波峰因子趋势</option>
                            <option value="health">健康评分趋势</option>
                        </select>
                    </div>
                    <div class="control-item">
                        <label>&nbsp;</label>
                        <button class="btn btn-primary" onclick="runComparison()">
                            <i class="bi bi-play-fill"></i> 开始对比
                        </button>
                    </div>
                </div>
            </div>

            <!-- Comparison Charts -->
            <div class="charts-grid">
                <div class="chart-card chart-card-wide">
                    <div class="chart-card-header">
                        <h5><i class="bi bi-graph-up"></i> <span id="compareChartTitle">RMS 趋势对比</span></h5>
                    </div>
                    <div class="chart-body" id="chartCompareTrend" style="height: 450px;"></div>
                </div>

                <div class="chart-card">
                    <div class="chart-card-header"><h5><i class="bi bi-bar-chart-steps"></i> 统计指标对比 - RMS</h5></div>
                    <div class="chart-body" id="chartCompareRmsBar" style="height: 400px;"></div>
                </div>

                <div class="chart-card">
                    <div class="chart-card-header"><h5><i class="bi bi-bar-chart-steps"></i> 统计指标对比 - 峰值</h5></div>
                    <div class="chart-body" id="chartComparePeakBar" style="height: 400px;"></div>
                </div>

                <div class="chart-card chart-card-wide">
                    <div class="chart-card-header"><h5><i class="bi bi-heart-pulse"></i> 健康评分雷达图</h5></div>
                    <div class="chart-body" id="chartRadar" style="height: 450px;"></div>
                </div>
            </div>

            <!-- Comparison Summary Table -->
            <div class="chart-card">
                <div class="chart-card-header"><h5><i class="bi bi-table"></i> 对比汇总表</h5></div>
                <div style="overflow-x: auto; padding: 16px;">
                    <table class="data-table" id="compareTable">
                        <thead>
                            <tr>
                                <th>轴承编号</th>
                                <th>工作条件</th>
                                <th>故障类型</th>
                                <th>平均水平RMS</th>
                                <th>平均垂直RMS</th>
                                <th>退化率(水平)</th>
                                <th>退化率(垂直)</th>
                                <th>健康评分</th>
                                <th>健康状态</th>
                            </tr>
                        </thead>
                        <tbody id="compareTableBody">
                            <tr><td colspan="9" class="text-center text-muted">请选择轴承并点击"开始对比"</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        let charts = {};
        let bearingList = [];
        let comparisonData = [];

        document.addEventListener('DOMContentLoaded', function() {
            initCompareCharts();
            loadBearingCheckboxes();
            updateTime();
            setInterval(updateTime, 10000);
        });

        function updateTime() {
            document.getElementById('topbarTime').textContent = new Date().toLocaleString('zh-CN');
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        async function handleLogout() {
            try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (e) {}
            window.location.href = '/login';
        }

        async function loadBearingCheckboxes() {
            const dataset = document.getElementById('datasetFilter').value;
            const container = document.getElementById('bearingMultiSelect');

            try {
                const resp = await fetch(`/api/bearings?dataset=${dataset}`);
                const data = await resp.json();
                bearingList = data.bearings;

                container.innerHTML = bearingList.map((b, i) => `
                    <label class="bearing-checkbox" title="${b.bearing_no} - ${b.fault_type || '未知'}">
                        <input type="checkbox" value="${b.bearing_no}" data-index="${i}"
                               onchange="onBearingCheck()">
                        <span class="check-dot" style="background: ${getFaultColor(b.fault_type)}"></span>
                        <span class="check-label">${b.bearing_no}</span>
                        <span class="check-sub">${b.fault_type || '--'}</span>
                    </label>
                `).join('');
            } catch (e) {
                container.innerHTML = '<div class="text-danger text-center py-2">加载失败</div>';
            }
        }

        function onBearingCheck() {
            const checked = document.querySelectorAll('#bearingMultiSelect input:checked');
            if (checked.length > 4) {
                alert('最多选择4个轴承进行对比');
                event.target.checked = false;
                return;
            }
        }

        async function runComparison() {
            const checked = document.querySelectorAll('#bearingMultiSelect input:checked');
            if (checked.length < 2) {
                alert('请至少选择2个轴承进行对比');
                return;
            }

            const bearings = Array.from(checked).map(c => c.value);
            const metric = document.getElementById('compareMetric').value;

            const metricNames = {
                'rms': 'RMS 趋势对比',
                'peak': '峰值趋势对比',
                'peak_to_peak': '峰峰值趋势对比',
                'crest_factor': '波峰因子趋势对比',
                'health': '健康评分趋势对比'
            };
            document.getElementById('compareChartTitle').textContent = metricNames[metric] || '趋势对比';

            // Show loading
            Object.values(charts).forEach(c => c && c.showLoading({ text: '对比分析中...' }));

            try {
                // Fetch data for each bearing
                const promises = bearings.map(async (bn) => {
                    const [aggResp, summaryResp] = await Promise.all([
                        fetch(`/api/bearing/${bn}/aggregate_stats?limit=300`),
                        fetch(`/api/bearing/${bn}/health_summary`)
                    ]);
                    return {
                        bearing_no: bn,
                        agg: await aggResp.json(),
                        summary: await summaryResp.json()
                    };
                });

                comparisonData = await Promise.all(promises);

                updateCompareTrendChart(metric);
                updateCompareBarCharts();
                updateRadarChart();
                updateCompareTable();

            } catch (e) {
                console.error('Comparison failed:', e);
                alert('对比分析失败，请重试');
            } finally {
                Object.values(charts).forEach(c => c && c.hideLoading());
            }
        }

        function updateCompareTrendChart(metric) {
            const chart = charts.compareTrend;
            if (!chart) return;

            const colors = ['#2980b9', '#e74c3c', '#27ae60', '#8e44ad'];
            const series = comparisonData.map((d, i) => {
                const stats = d.agg.stats || [];
                const times = stats.map(s => s.timestamp);

                let values;
                switch (metric) {
                    case 'rms':
                        values = stats.map(s => (s.h_rms + s.v_rms) / 2);
                        break;
                    case 'peak':
                        values = stats.map(s => Math.max(s.h_peak, s.v_peak));
                        break;
                    case 'peak_to_peak':
                        values = stats.map(s => (s.h_pp + s.v_pp) / 2);
                        break;
                    case 'crest_factor':
                        values = stats.map(s => (s.h_crest_factor + s.v_crest_factor) / 2);
                        break;
                    case 'health':
                        // Use RMS deviation as proxy
                        values = stats.map(s => (s.h_rms + s.v_rms) / 2);
                        break;
                    default:
                        values = stats.map(s => (s.h_rms + s.v_rms) / 2);
                }

                return {
                    name: d.bearing_no,
                    type: 'line',
                    data: values,
                    smooth: true,
                    symbol: 'none',
                    lineStyle: { color: colors[i % colors.length], width: 2 }
                };
            });

            chart.setOption({
                title: null,
                tooltip: { trigger: 'axis' },
                legend: { data: comparisonData.map(d => d.bearing_no), top: 5 },
                grid: { left: 55, right: 25, top: 40, bottom: 55 },
                dataZoom: [
                    { type: 'inside' },
                    { type: 'slider', height: 20, bottom: 10 }
                ],
                xAxis: {
                    type: 'category',
                    data: (comparisonData[0]?.agg.stats || []).map(s => s.timestamp),
                    axisLabel: { rotate: 45, fontSize: 9 }
                },
                yAxis: { type: 'value', name: '幅值 / 因子', axisLabel: { fontSize: 10 } },
                series: series
            });
        }

        function updateCompareBarCharts() {
            if (!charts.compareRmsBar || !charts.comparePeakBar) return;

            const bearings = comparisonData.map(d => d.bearing_no);
            const colors = ['#2980b9', '#e74c3c', '#27ae60', '#8e44ad'];

            // RMS bar chart
            const hRmsData = comparisonData.map((d, i) => {
                const stats = d.agg.stats || [];
                const avgH = stats.reduce((s, x) => s + x.h_rms, 0) / (stats.length || 1);
                const avgV = stats.reduce((s, x) => s + x.v_rms, 0) / (stats.length || 1);
                return { h: round4(avgH), v: round4(avgV) };
            });

            charts.compareRmsBar.setOption({
                title: null,
                tooltip: { trigger: 'axis' },
                legend: { data: ['平均水平RMS', '平均垂直RMS'], top: 5 },
                grid: { left: 70, right: 25, top: 35, bottom: 50 },
                xAxis: { type: 'category', data: bearings, axisLabel: { rotate: 30, fontSize: 10 } },
                yAxis: { type: 'value', name: 'RMS (g)' },
                series: [
                    {
                        name: '平均水平RMS', type: 'bar',
                        data: hRmsData.map((d, i) => ({ value: d.h, itemStyle: { color: colors[i % colors.length] } })),
                        label: { show: true, position: 'top', fontSize: 10 }
                    },
                    {
                        name: '平均垂直RMS', type: 'bar',
                        data: hRmsData.map((d, i) => ({ value: d.v, itemStyle: { color: colors[i % colors.length], opacity: 0.6 } })),
                        label: { show: true, position: 'top', fontSize: 10 }
                    }
                ]
            });

            // Peak bar chart
            const peakData = comparisonData.map((d, i) => {
                const stats = d.agg.stats || [];
                const avgH = stats.reduce((s, x) => s + x.h_peak, 0) / (stats.length || 1);
                const avgV = stats.reduce((s, x) => s + x.v_peak, 0) / (stats.length || 1);
                return { h: round4(avgH), v: round4(avgV) };
            });

            charts.comparePeakBar.setOption({
                title: null,
                tooltip: { trigger: 'axis' },
                legend: { data: ['平均水平峰值', '平均垂直峰值'], top: 5 },
                grid: { left: 70, right: 25, top: 35, bottom: 50 },
                xAxis: { type: 'category', data: bearings, axisLabel: { rotate: 30, fontSize: 10 } },
                yAxis: { type: 'value', name: '峰值 (g)' },
                series: [
                    {
                        name: '平均水平峰值', type: 'bar',
                        data: peakData.map((d, i) => ({ value: d.h, itemStyle: { color: colors[i % colors.length] } })),
                        label: { show: true, position: 'top', fontSize: 10 }
                    },
                    {
                        name: '平均垂直峰值', type: 'bar',
                        data: peakData.map((d, i) => ({ value: d.v, itemStyle: { color: colors[i % colors.length], opacity: 0.6 } })),
                        label: { show: true, position: 'top', fontSize: 10 }
                    }
                ]
            });
        }

        function updateRadarChart() {
            const chart = charts.radar;
            if (!chart) return;

            const colors = ['#2980b9', '#e74c3c', '#27ae60', '#8e44ad'];

            const indicators = [
                { name: 'RMS', max: 1 },
                { name: '峰值', max: 1 },
                { name: '峰峰值', max: 1 },
                { name: '稳定性', max: 100 },
                { name: '退化率', max: 100 }
            ];

            const seriesData = comparisonData.map((d, i) => {
                const stats = d.agg.stats || [];
                const n = stats.length || 1;

                const avgRms = stats.reduce((s, x) => s + (x.h_rms + x.v_rms) / 2, 0) / n;
                const avgPeak = stats.reduce((s, x) => s + Math.max(x.h_peak, x.v_peak), 0) / n;
                const avgPp = stats.reduce((s, x) => s + (x.h_pp + x.v_pp) / 2, 0) / n;

                // Stability: inverse of RMS std deviation
                const rmsStd = Math.sqrt(stats.reduce((s, x) => s + Math.pow((x.h_rms + x.v_rms) / 2 - avgRms, 2), 0) / n);
                const stability = Math.max(0, 100 - rmsStd * 200);

                const hDeg = d.summary.h_degradation_pct || 0;

                // Normalize values
                const allRms = comparisonData.flatMap(dd =>
                    dd.agg.stats.map(s => (s.h_rms + s.v_rms) / 2));
                const maxRms = Math.max(...allRms, 0.001);

                return {
                    name: d.bearing_no,
                    value: [
                        round4(avgRms / maxRms),
                        round4(avgPeak / maxRms),
                        round4(avgPp / maxRms),
                        round4(stability),
                        round4(Math.min(100, Math.abs(hDeg)))
                    ],
                    lineStyle: { color: colors[i % colors.length] },
                    itemStyle: { color: colors[i % colors.length] },
                    areaStyle: { color: colors[i % colors.length], opacity: 0.1 }
                };
            });

            chart.setOption({
                title: null,
                tooltip: {},
                legend: { data: comparisonData.map(d => d.bearing_no), bottom: 0 },
                radar: {
                    indicator: indicators,
                    radius: '65%'
                },
                series: [{ type: 'radar', data: seriesData }]
            });
        }

        function updateCompareTable() {
            const tbody = document.getElementById('compareTableBody');

            const getScoreColor = (score) => {
                if (score >= 80) return '#52c41a';
                if (score >= 60) return '#faad14';
                if (score >= 40) return '#fa8c16';
                return '#f5222d';
            };

            const getStatus = (score) => {
                if (score >= 80) return '健康';
                if (score >= 60) return '轻微退化';
                if (score >= 40) return '中度退化';
                if (score >= 20) return '严重退化';
                return '危险';
            };

            tbody.innerHTML = comparisonData.map(d => {
                const stats = d.agg.stats || [];
                const n = stats.length || 1;
                const avgHrms = stats.reduce((s, x) => s + x.h_rms, 0) / n;
                const avgVrms = stats.reduce((s, x) => s + x.v_rms, 0) / n;

                const score = d.summary.health_score || 0;
                const color = getScoreColor(score);

                return `
                    <tr>
                        <td><strong>${d.bearing_no}</strong></td>
                        <td>${d.summary.condition_name || '--'}</td>
                        <td>${d.summary.fault_type || '--'} ${d.summary.fault_element || ''}</td>
                        <td>${round4(avgHrms)}</td>
                        <td>${round4(avgVrms)}</td>
                        <td style="color: ${d.summary.h_degradation_pct > 50 ? '#e74c3c' : '#27ae60'}">${d.summary.h_degradation_pct}%</td>
                        <td style="color: ${d.summary.v_degradation_pct > 50 ? '#e74c3c' : '#27ae60'}">${d.summary.v_degradation_pct}%</td>
                        <td style="color: ${color}; font-weight: bold;">${score}</td>
                        <td><span class="status-tag" style="background: ${color}20; color: ${color}; border: 1px solid ${color}40;">${getStatus(score)}</span></td>
                    </tr>
                `;
            }).join('');
        }

        function initCompareCharts() {
            charts.compareTrend = echarts.init(document.getElementById('chartCompareTrend'));
            charts.compareRmsBar = echarts.init(document.getElementById('chartCompareRmsBar'));
            charts.comparePeakBar = echarts.init(document.getElementById('chartComparePeakBar'));
            charts.radar = echarts.init(document.getElementById('chartRadar'));

            window.addEventListener('resize', () => {
                Object.values(charts).forEach(c => c && c.resize());
            });

            // Initialize empty charts (no placeholder text)
        }

        function getFaultColor(faultType) {
            if (!faultType) return '#95a5a6';
            const t = faultType.toLowerCase();
            if (t.includes('inner') || t.includes('内圈')) return '#e74c3c';
            if (t.includes('outer') || t.includes('外圈')) return '#f39c12';
            if (t.includes('ball') || t.includes('滚动体')) return '#2980b9';
            if (t.includes('cage') || t.includes('保持架')) return '#8e44ad';
            if (t.includes('wear') || t.includes('磨损')) return '#d35400';
            if (t.includes('fatigue') || t.includes('疲劳')) return '#c0392b';
            if (t.includes('fracture') || t.includes('断裂')) return '#7f8c8d';
            if (t.includes('health') || t.includes('健康')) return '#27ae60';
            return '#3498db';
        }

        function round4(val) {
            if (!val) return 0;
            return Math.round(val * 10000) / 10000;
        }
    </script>
</body>
</html>
